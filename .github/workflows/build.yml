
name: Build MPR SQUAD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          PROJECT_DIR=$(find . -type f -name gradlew -not -path '*/.gradle/*' | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle wrapper পাওয়া যায়নি"
            exit 1
          fi
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MPR-SQUAD-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          
